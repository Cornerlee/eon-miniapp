<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EP · закладка импорта</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
/* Две роли одной страницы: без ?recv — инструкция и кнопка-закладка; с ?recv — принимает данные товара от закладки и создаёт черновик */
:root{--bg:#0b0b0c;--card:#151517;--fg:#f3f2ef;--muted:#8d8c88;--line:#2a2a2d;--ok:#5cc28a;--bad:#ff5a4f;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Onest",system-ui,sans-serif;padding:40px 20px}
main{max-width:620px;margin:0 auto}
h1{font-size:22px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 6px}
.mut{color:var(--muted)}
ol{padding-left:20px}ol li{margin:8px 0}
.bm{display:inline-block;margin:18px 0;padding:14px 22px;background:var(--fg);color:var(--bg);font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-radius:2px;cursor:grab}
.box{border:1px solid var(--line);background:var(--card);padding:16px;margin-top:18px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
img.th{width:72px;height:72px;object-fit:cover;background:#fff;margin:4px}
</style>
</head>
<body><main id="m"></main>
<script src="config.js"></script>
<script>
// в адресе: #КЛЮЧ, а с телефона ещё и данные товара: #КЛЮЧ|{…}
const H = location.hash.slice(1), KEY = H.split("|")[0], HDATA = H.includes("|") ? H.slice(H.indexOf("|") + 1) : "";
const m = document.getElementById("m");
const recv = new URLSearchParams(location.search).has("recv");

// код, который выполняется на странице товара Pinduoduo или 1688 (в вашем браузере)
function grab(){
  var h = document.documentElement.innerHTML, u = location.href, src = /1688\.com/.test(u) ? "1688" : "pdd";
  var imgs = [], prices = [], props = [], skus = [], title = "";
  try {
    var g = window.rawData && rawData.store && rawData.store.initDataObj && rawData.store.initDataObj.goods;
    if (g) {
      title = g.goodsName || "";
      (g.topGallery || []).concat(g.detailGallery || []).forEach(function(x){ imgs.push(typeof x == "string" ? x : (x.url || x.imgUrl)); });
      (g.skus || []).forEach(function(s){ var p = Number(s.groupPrice || s.normalPrice || s.price) || 0; if (p > 1000 && p % 1 === 0) p = p / 100; skus.push({spec: (s.specs || []).map(function(z){ return z.spec_value || z.specValue; }).join(" / "), price: p}); if (p) prices.push(p); });
      (g.goodsProperty || []).forEach(function(p){ props.push([p.key, (p.values || []).join(", ")]); });
    }
  } catch (e) {}
  if (!title && src === "1688") title = document.title.replace(/\s*[-–|]\s*(阿里巴巴|1688).*$/, "");
  if (!title) title = (document.querySelector('meta[property="og:title"]') || {}).content || (document.querySelector("h1") || {}).innerText || document.title;
  document.querySelectorAll("img").forEach(function(i){ var s = i.currentSrc || i.src; if (s && (i.naturalWidth >= 350 || i.width >= 250)) imgs.push(s); });
  (h.match(/https?:\/\/[^"'\s()<>]+?(?:alicdn\.com\/img\/ibank|pddpic\.com|yangkeduo\.com)[^"'\s()<>]*?\.(?:jpe?g|png|webp)/gi) || []).forEach(function(x){ imgs.push(x); });
  var seen = {}, clean = [];
  imgs.forEach(function(x){
    if (!x || /avatar|icon|logo|sprite|tps-|\.gif/i.test(x)) return;
    x = x.replace(/^\/\//, "https://").replace(/(\.(?:jpe?g|png))_[^\/]*$/i, "$1").replace(/\.\d+x\d+(?:q\d+)?\.jpg$/i, "").split("?")[0];
    if (!seen[x]) { seen[x] = 1; clean.push(x); }
  });
  if (!prices.length) (h.match(/"(?:price|discountPrice|priceDisplay|beginPrice)"\s*:\s*"?(\d+(?:\.\d+)?)/g) || []).forEach(function(s){ var n = parseFloat(s.replace(/[^\d.]/g, "")); if (n > 0) prices.push(n); });
  if (!props.length) document.querySelectorAll("table tr, .offer-attr-item, .attribute-item").forEach(function(r){ var c = r.innerText.split(/\t|\n|：|:/).map(function(s){ return s.trim(); }).filter(Boolean); if (c.length >= 2 && c[0].length < 20) props.push([c[0], c.slice(1).join(" ")]); });
  // таблицы со страницы (там бывает размерная сетка: 衣长, 胸围, 肩宽 …)
  var tables = [].map.call(document.querySelectorAll("table"), function(t){ return t.innerText; }).filter(function(t){ return /衣长|胸围|肩宽|袖长|腰围|臀围|裤长|尺码/.test(t); }).join("\n").slice(0, 4000);
  return {source: src, url: u.split("#")[0], title: String(title).trim(), images: clean.slice(0, 20), prices: prices, skus: skus.slice(0, 80), props: props.slice(0, 40), tables: tables, text: (document.body.innerText || "").slice(0, 8000)};
}

if (!recv) {
  // страница с кнопкой-закладкой
  const receiver = location.origin + location.pathname + "?recv=1#" + KEY;
  // на компьютере — маленькое окно + postMessage; на телефоне всплывающие окна режут, поэтому уходим на страницу EP и несём данные в адресе
  const body = "(function(){var d=(" + grab.toString() + ")();var R=" + JSON.stringify(receiver) + ";"
    + "if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){d.text=d.text.slice(0,3000);d.tables=(d.tables||'').slice(0,2000);location.href=R+'|'+encodeURIComponent(JSON.stringify(d));return;}"
    + "var w=window.open(R,'ep_import','width=520,height=640');if(!w){location.href=R+'|'+encodeURIComponent(JSON.stringify(d));return;}"
    + "var n=0,t=setInterval(function(){try{w.postMessage({ep:d},'*')}catch(e){}if(++n>40)clearInterval(t)},500);window.addEventListener('message',function(e){if(e.data&&e.data.ep_ok)clearInterval(t)});})();";
  const code = "javascript:" + encodeURIComponent(body);
  m.innerHTML = KEY ? `
    <h1>Закладка «→ EP»</h1>
    <p class="mut">Импорт товара с Pinduoduo и 1688 в черновики магазина EP.</p>
    <h2 style="font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:26px 0 4px">На компьютере</h2>
    <a class="bm" id="bm" href="#">→ EP</a>
    <ol>
      <li>Покажите панель закладок: <b>Ctrl + Shift + B</b>.</li>
      <li>Перетащите белую кнопку <b>«→ EP»</b> на панель закладок мышкой.</li>
      <li>Откройте товар и нажмите закладку — откроется окошко с готовым черновиком.</li>
    </ol>
    <h2 style="font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:26px 0 4px">На телефоне</h2>
    <button class="bm" id="cpy" style="border:0;cursor:pointer">Скопировать код закладки</button>
    <p class="mut" id="cpyok"></p>
    <b>Android, Chrome</b>
    <ol>
      <li>Нажмите «Скопировать код закладки».</li>
      <li>Добавьте эту страницу в закладки: ⋮ → ☆.</li>
      <li>⋮ → Закладки → нажмите и удерживайте новую закладку → Изменить. Название: <b>EP</b>, в поле адреса удалите всё и вставьте скопированный код. Сохраните.</li>
      <li>На странице товара нажмите на адресную строку, напишите <b>EP</b> и выберите закладку из подсказок (со звёздочкой).</li>
    </ol>
    <b>iPhone, Safari</b>
    <ol>
      <li>Нажмите «Скопировать код закладки».</li>
      <li>Значок «Поделиться» → «Добавить закладку» → Сохранить.</li>
      <li>Значок книжки → Изменить → нажмите на новую закладку. Название: <b>EP</b>, в поле адреса удалите всё и вставьте код. Готово.</li>
      <li>На странице товара: значок книжки → <b>EP</b>.</li>
    </ol>
    <p class="mut">Товар открывайте в браузере, не в приложении: 1688 — m.1688.com или detail.1688.com, Pinduoduo — mobile.yangkeduo.com (там нужно войти в аккаунт). После нажатия закладки откроется страница EP с готовым черновиком, кнопкой «Назад» вернётесь к товару.</p>
    <p class="mut">Ключ внутри закладки — как пароль: никому её не пересылайте. Новый ключ — команда <b>/key</b> в боте, старые закладки после этого перестанут работать.</p>`
    : `<h1>Нет ключа</h1><p class="mut">Отправьте боту команду <b>/key</b> и откройте ссылку из ответа.</p>`;
  if (KEY) {
    const a = document.getElementById("bm"); a.href = code; a.onclick = e => { e.preventDefault(); alert("Не нажимайте здесь — перетащите кнопку на панель закладок."); };
    document.getElementById("cpy").onclick = async () => {
      const ok = document.getElementById("cpyok");
      try { await navigator.clipboard.writeText(code); ok.textContent = "Скопировано ✓ Теперь вставьте код в адрес закладки."; }
      catch (_) { const ta = document.createElement("textarea"); ta.value = code; ta.style.cssText = "width:100%;height:120px"; ok.after(ta); ta.select(); try { document.execCommand("copy"); ok.textContent = "Скопировано ✓"; } catch (e) { ok.textContent = "Не скопировалось — выделите текст ниже вручную."; } }
    };
  }
} else {
  // приёмник: получает данные от закладки (сообщением или в адресе) и создаёт черновик на сервере
  m.innerHTML = `<h1>Импорт в EP</h1><p class="mut" id="st">Жду данные со страницы товара…</p><div id="res"></div>`;
  let busy = false;
  const esc = t => String(t).replace(/</g, "&lt;");
  async function importData(d, fromPhone){
    if (busy) return; busy = true;
    const st = document.getElementById("st");
    st.innerHTML = `Нашёл: <b>${esc((d.title || "").slice(0, 80))}</b><br>${(d.images || []).length} фото · цены: ${(d.prices || []).slice(0, 5).join(", ") || "не нашёл"}<br>Загружаю фото и собираю описание… 10–30 секунд.`;
    try {
      const r = await fetch(window.EON_API, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({action: "import_draft", token: KEY, data: d})});
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      st.innerHTML = `<span class="ok">✓ Черновик ${j.id} создан</span>`;
      document.getElementById("res").innerHTML = `<div class="box"><b>${esc(j.title)}</b><br>${j.photos} фото · цена ${Number(j.price).toLocaleString("ru-RU")} ₽${j.dict ? '<br><span class="mut">Текст собран по словарю — проверьте название и описание</span>' : ""}<p class="mut">Проверьте и опубликуйте в боте: Каталог → меню → Черновики.</p>${fromPhone ? '<button class="bm" style="border:0;cursor:pointer" onclick="history.back()">← Назад к товару</button>' : '<p class="mut">Это окно можно закрыть.</p>'}</div>`;
    } catch (err) { st.innerHTML = `<span class="bad">Не получилось: ${esc(err.message || err)}</span>`; busy = false; }
  }
  window.addEventListener("message", e => {
    if (!e.data || !e.data.ep) return;
    try { e.source.postMessage({ep_ok: 1}, "*"); } catch (_) {}
    importData(e.data.ep, false);
  });
  if (HDATA) {
    let d = null;
    try { d = JSON.parse(decodeURIComponent(HDATA)); } catch (_) {}
    history.replaceState(null, "", location.pathname + "?recv=1#" + KEY);  // убираем данные из адреса
    if (d) importData(d, true); else document.getElementById("st").innerHTML = '<span class="bad">Данные товара не дошли — попробуйте ещё раз</span>';
  }
}
</script>
</body>
</html>

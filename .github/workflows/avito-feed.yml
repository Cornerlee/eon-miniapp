name: Avito feed
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: avito-feed
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/avito_mirror.py
      - name: Commit changes
        run: |
          git add avito
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="avito-bot" -c user.email="avito-bot@users.noreply.github.com" commit -m "Avito feed update"
          git push

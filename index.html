<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EP</title>
<link rel="icon" href="icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap">
<style>
/* EP: тёмный монохромный магазин. Шапка (меню · логотип · корзина) → экраны → нижняя панель Главная / Match / Лайки */
:root{
  --bg:#0b0b0c; --card:#151517; --card2:#1d1d20; --fg:#f3f2ef; --muted:#8d8c88; --line:#2a2a2d;
  --inv:#f3f2ef; --inv-fg:#0b0b0c; --danger:#ff5a4f; --ok:#5cc28a;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --top:52px; --bar:58px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
img{display:block;max-width:100%}
.up{text-transform:uppercase;letter-spacing:.14em}
.mut{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* шапка */
.top{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0;display:flex;align-items:center;justify-content:space-between;z-index:30;background:linear-gradient(var(--bg) 60%,transparent)}
.top .logo{position:absolute;left:50%;transform:translateX(-50%)}
.top .logo img{height:24px;width:auto}
.ib{width:40px;height:40px;display:grid;place-items:center;position:relative}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.badge{position:absolute;top:4px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--inv);color:var(--inv-fg);font-size:10px;font-weight:700;line-height:16px;text-align:center;padding:0 4px}
.badge.red{background:var(--danger);color:#fff}
main{padding:calc(var(--top) + env(safe-area-inset-top,0px)) 12px calc(var(--bar) + 24px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;min-height:100vh}

/* нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(11,11,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.bar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:80px}
.bar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5}
.bar button[aria-current="true"]{color:var(--fg)}

/* общие элементы */
.back{display:inline-flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 0 14px}
.h1{font-size:26px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 14px;display:flex;align-items:baseline;gap:12px;line-height:1.15}
.h1 small{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.14em}
.h2{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.h2 button{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.14em}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;padding:0 16px;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line);background:transparent}
.btn.w{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:38px;font-size:11px;width:auto}
.btn.del{color:var(--danger)}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);padding:8px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
.lbl{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.f{width:100%;background:var(--card);border:1px solid var(--line);padding:13px 14px;outline:none;border-radius:0}
.f:focus{border-color:var(--muted)}
.f::placeholder{color:#5f5e5b;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
textarea.f{min-height:96px;resize:vertical}
textarea.f.big{min-height:220px}
.note{font-size:12px;color:var(--muted)}
.empty{padding:60px 0;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* главная: блок дропа */
.hero{position:relative;margin:0 -12px;min-height:82vh;display:flex;background:#111 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.1) 38%,rgba(0,0,0,.25) 70%,var(--bg))}
.hero .frame{position:relative;margin:10px 12px 18px;border:1px solid rgba(255,255,255,.28);padding:22px 16px 18px;display:flex;flex-direction:column;flex:1}
.hero .date{font-size:11px;letter-spacing:.16em}
.hero .t{font-size:30px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;line-height:1.1;margin:8px 0 4px;text-wrap:balance}
.hero .s{font-size:16px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:#cfcdc8;margin-bottom:18px}
.hero .txt{white-space:pre-line;color:#e4e2dd;font-size:14px;max-width:60ch}
.hero .go{margin-top:auto;align-self:flex-end;padding-top:22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;display:flex;gap:12px;align-items:center}

/* сетка товаров */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid.L-1{grid-template-columns:1fr;gap:14px}
.grid.L-1 .nm{font-size:12px;-webkit-line-clamp:3}.grid.L-1 .pr{font-size:14px}
.grid.L-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.L-3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid.L-4{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.grid.L-3 .cap,.grid.L-4 .cap{padding:6px 6px 8px}
.grid.L-3 .nm,.grid.L-4 .nm{font-size:8.5px;letter-spacing:.08em}
.grid.L-3 .pr,.grid.L-4 .pr{font-size:10px}
.grid.L-4 .nm{-webkit-line-clamp:1}
.grid.L-3 .heart,.grid.L-4 .heart{width:22px;height:22px;top:3px;right:3px}
.grid.L-3 .heart svg,.grid.L-4 .heart svg{width:12px;height:12px}
.grid.L-4 .real{display:none}
.grid.L-full{grid-template-columns:1fr;gap:2px;margin:0 -12px}
.grid.L-full .ph{aspect-ratio:4/5}
.grid.L-full .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:40px 14px 14px}
.grid.L-full .nm{font-size:13px}.grid.L-full .pr{font-size:15px}
.grid.L-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.grid.L-row::-webkit-scrollbar{display:none}
.grid.L-row .pc{flex:none;width:44%;scroll-snap-align:start}
.feedbar{position:relative}
.fsearch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.fsearch .f{padding:11px 12px}
.secpill{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;border:1px solid var(--inv);font-size:12px;letter-spacing:.06em}
.secpill button{width:26px;height:26px}
.secpanel{margin-top:10px;border:1px solid var(--line);max-height:50vh;overflow-y:auto;padding:0 12px}
.secrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:left}
.secrow:last-child{border-bottom:0}
.secline{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.secline .secrow{border-bottom:0;flex:1;min-width:0}
.secedit2{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.secrow[aria-pressed="true"] span{text-decoration:underline;text-underline-offset:4px}
.feedlay{display:flex;justify-content:flex-end;gap:6px;margin:12px 0 10px}
.feedlay button{border:1px solid var(--line);padding:6px 10px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.feedlay button[aria-pressed="true"]{color:var(--inv-fg);background:var(--inv);border-color:var(--inv)}
.covrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.covrow::-webkit-scrollbar{display:none}
.covrow button{flex:none;width:58px;height:58px;border:2px solid transparent;background:#fff;padding:0}
.covrow button.on{border-color:var(--inv)}
.covrow img{width:100%;height:100%;object-fit:cover}
.secedit{font-size:10px;color:var(--muted);letter-spacing:.12em;border:1px dashed var(--line);padding:4px 8px}
.lay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lay button{border:1px solid var(--line);padding:10px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px}
.lay button[aria-pressed="true"]{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
.lay i{display:grid;gap:2px;width:44px}
.lay i b{display:block;aspect-ratio:1/1;background:currentColor;opacity:.55}
.chosen .gitem{grid-template-columns:22px 48px minmax(0,1fr) 36px 36px}
.adminbar{display:flex;gap:8px;margin:-4px 0 12px}
.adminbar .btn{min-height:40px;font-size:11px}
.pc{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);min-width:0}
.pc .ph{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .cap{padding:9px 10px 11px;text-align:left}
.pc .nm{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .pr{font-size:12px;margin-top:3px}
.pc .pr s{color:var(--muted);margin-left:6px;font-size:11px}
.heart{position:absolute;top:6px;right:6px;width:30px;height:30px;display:grid;place-items:center;background:rgba(0,0,0,.42);z-index:2}
.heart svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.6}
.heart[aria-pressed="true"] svg{fill:#fff}
.tag{position:absolute;left:6px;top:6px;background:var(--inv);color:var(--inv-fg);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;z-index:2}
.tag.dark{background:rgba(0,0,0,.65);color:#fff}
.tag.stock{top:auto;bottom:6px;background:#2f7d55;color:#fff}

/* карточка товара */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#fff}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.dots i{width:5px;height:5px;background:var(--line)}
.dots i.on{background:var(--fg)}
.ptitle{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-top:16px}
.ptitle h1{font-size:17px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:0;line-height:1.3;text-wrap:balance}
.ptitle .heart{position:static;background:none;width:34px;height:34px;flex:none}
.ptitle .heart svg{width:22px;height:22px}
.pprice{font-size:20px;margin:10px 0 16px}
.pprice s{color:var(--muted);font-size:14px;margin-left:10px}
.attrs{border-top:1px solid var(--line);margin:0}
.attrs div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.attrs dt{color:var(--muted)}
.attrs dd{margin:0;text-align:right}
.desc{margin:16px 0;color:#d9d7d2}
.desc p{margin:0 0 10px}
.desc ul{margin:0 0 10px;padding-left:18px}
.desc li{margin:3px 0}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sizes button{min-width:46px;height:40px;padding:0 12px;border:1px solid var(--line);font-size:12px;letter-spacing:.1em}
.sizes button[aria-pressed="true"]{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}

/* панели: корзина и меню */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;z-index:41;width:min(88vw,420px);background:var(--card);display:flex;flex-direction:column;transition:transform .25s ease;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.drawer.r{right:0;transform:translateX(100%)}
.drawer.l{left:0;transform:translateX(-100%)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 12px 18px;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.dh small{font-weight:400;color:var(--muted);margin-left:10px;letter-spacing:.12em}
.db{flex:1;overflow-y:auto;padding:0 18px}
.df{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.menu button.mi{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:left;border-bottom:1px solid var(--line)}
.menu .sub button.mi{padding-left:14px;color:#cfcdc8;font-size:11px}
.menu .sect{margin-top:22px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.cl img{width:62px;height:62px;object-fit:cover;background:#fff}
.cl .nm{font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
.qty{display:flex;align-items:center;border:1px solid var(--line);height:28px}
.qty button{width:26px;height:26px}
.qty span{min-width:20px;text-align:center;font-size:12px}
.rm{color:var(--muted);font-size:16px;width:28px;height:28px;margin-top:6px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.tot b{font-size:17px;letter-spacing:0;font-weight:500}

/* оформление */
.ol{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);padding:10px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
.done{text-align:center;padding:60px 10px}
.done .big{font-size:40px;font-weight:300}

/* match */
.mwrap{position:relative;height:calc(100vh - var(--top) - var(--bar) - 130px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:360px;margin-top:6px}
.mcard{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;touch-action:pan-y;user-select:none;transition:transform .25s ease,opacity .25s}
.mcard .ph{flex:1;min-height:0;background:#fff;overflow:hidden}
.mcard .ph img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mcard .cap{display:flex;justify-content:space-between;gap:12px;padding:12px 12px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.mcard .stamp{position:absolute;top:20px;padding:6px 12px;border:2px solid;font-weight:700;letter-spacing:.16em;font-size:13px;opacity:0;text-transform:uppercase;background:rgba(0,0,0,.4)}
.mcard .stamp.like{left:16px;color:var(--ok);transform:rotate(-12deg)}
.mcard .stamp.nope{right:16px;color:var(--danger);transform:rotate(12deg)}
.mbtns{display:flex;justify-content:center;gap:22px;margin-top:16px}
.mbtns button{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.mbtns button.y{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
.mbtns svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}

/* заказы */
.ord{border:1px solid var(--line);padding:12px;margin-bottom:10px}
.ord .hd{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.ord .st{padding:2px 8px;border:1px solid var(--line);font-size:10px;white-space:nowrap}
.ord .st.new{border-color:var(--danger);color:var(--danger)}
.ord .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ord .ln{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px}
.ord .ln img{width:42px;height:42px;object-fit:cover;background:#fff;flex:none}
.ord .ct{margin-top:10px;font-size:12px;color:#d9d7d2;white-space:pre-line}

/* админ */
.adm{border:1px dashed var(--line);padding:12px;margin-top:22px}
.adm .ttl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.money div{background:var(--card2);padding:8px}
.money b{display:block;font-size:14px;font-weight:500}
.money span{font-size:10px;color:var(--muted)}
.good{color:var(--ok)}.bad{color:#e8a13a}
.realbox{border:1px solid #3a3320;background:#16140f;padding:10px 12px;margin:-6px 0 16px}
.realbox .ttl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#c9a54a;margin-bottom:6px}
.realbox .rr{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px}
.realbox .rr span{color:var(--muted)}
.realbox .rr b{font-weight:500}
.pc .real{font-size:10.5px;color:#c9a54a;margin-top:2px}
.lnk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:6px}
.lnk code{font-size:10.5px;color:#cfcdc8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;color:#9cc4ff}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pcell{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.pcell img{width:100%;height:100%;object-fit:cover}
.pcell button{position:absolute;top:3px;width:24px;height:24px;background:rgba(0,0,0,.7);color:#fff;font-size:13px}
.pcell .x{right:3px}.pcell .l{left:3px}
.pcell.first::after{content:"обложка";position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font-size:9px;text-align:center;letter-spacing:.1em;padding:2px}
.padd{display:grid;place-items:center;aspect-ratio:1/1;border:1px dashed var(--line);color:var(--muted);font-size:24px;cursor:pointer}
.grow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.grow .gname{flex:1;min-width:0;text-align:left;padding:12px 0;display:flex;flex-direction:column;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.grow .gname span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:none}
.gico{width:36px;height:36px;border:1px solid var(--line);flex:none}
.gico.del{color:var(--danger)}.gico.wide{width:auto;padding:0 10px;font-size:11px}
.gitem{display:grid;grid-template-columns:22px 48px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gitem input{width:20px;height:20px;accent-color:#f3f2ef;margin:0}
.gitem img{width:48px;height:48px;object-fit:cover;background:#fff}
.gitem .t{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .note{display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv);color:var(--inv-fg);padding:10px 16px;font-size:12px;letter-spacing:.08em;z-index:60;max-width:90vw;text-align:center}
.spin{padding:80px 0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.search{margin-bottom:4px}
</style>
</head>
<body>
<header class="top">
  <button class="ib" id="bMenu" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span class="badge red" id="bMenuN" hidden></span></button>
  <div class="logo"><img src="logo.png" alt="EP"></div>
  <button class="ib" id="bCart" aria-label="Корзина"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11h11.3L21 7H7"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span class="badge" id="bCartN" hidden></span></button>
</header>
<main id="app"><div class="spin">Загрузка</div></main>
<nav class="bar" id="bar">
  <button data-tab="home" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Главная</button>
  <button data-tab="match"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="11" height="15" rx="1"/><path d="M19 7v13H9"/></svg>Match</button>
  <button data-tab="likes"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Лайки</button>
</nav>
<div class="veil" id="veil"></div>
<aside class="drawer l" id="menu" aria-label="Меню"></aside>
<aside class="drawer r" id="cart" aria-label="Корзина"></aside>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const API = window.EON_API || "";
const BOT = window.EON_BOT || "eepshop_bot";
let BUY = null;  // id товара, если клиент пришёл по ссылке «Сразу заказ»
const deepLink = (kind, id) => `https://t.me/${BOT}?startapp=${kind}_${id}`;
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
let ITEMS = [], GROUPS = [], SET = {}, ORDERS = [], ADMIN = false, USER = null;
let CART = [], LIKES = [], SEEN = [], CONTACT = {}, RECENT = [];
let stack = [], drawer = null;

// ---------- утилиты ----------
const rub = n => Number(n || 0).toLocaleString("ru-RU") + " ₽";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const haptic = t => { try { tg && tg.HapticFeedback && (t === "light" ? tg.HapticFeedback.impactOccurred("light") : tg.HapticFeedback.notificationOccurred(t || "success")); } catch(_) {} };
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const STATUS = {active:"В продаже", sold:"Продано", hidden:"В архиве", draft:"Черновик"};
const OST = {new:"Новый", work:"В работе", sent:"Отправлен", done:"Завершён", cancel:"Отменён"};
// порядок по цвету: от тёмного к светлому, пастель в конце. Цвет берём из характеристики «Цвет», иначе из названия
const COLOR_STEPS = [["камуф", 9], ["чёрн", 0], ["черн", 0], ["тёмно-син", 1], ["темно-син", 1], ["navy", 1], ["бордо", 2], ["винн", 2], ["тёмно-корич", 3], ["графит", 4], ["светло-сер", 5], ["сер", 4],
  ["олив", 10], ["хаки", 10], ["зел", 11], ["шоколад", 12], ["корич", 12], ["кофе", 13], ["беж", 14], ["песоч", 14], ["крем", 15], ["молоч", 15], ["бел", 16], ["голуб", 17], ["лаванд", 18], ["роз", 19]];
const COLOR_FIX = {"EON-03": "кремовый", "EON-04": "голубой", "EON-07": "чёрный", "EON-20": "серый", "EON-23": "чёрный"};
function colorRank(it){
  const fact = (it.facts || []).find(([k]) => /^цвет/i.test(k));
  const src = (COLOR_FIX[it.id] || (fact && !/уточн/.test(fact[1]) ? fact[1] : "") || it.title).toLowerCase();
  const hit = COLOR_STEPS.find(([w]) => src.includes(w));
  return hit ? hit[1] : 8;
}
const byColor = list => [...list].sort((a, b) => colorRank(a) - colorRank(b) || (a.sort || 0) - (b.sort || 0));
const visible = () => byColor(ITEMS.filter(it => it.status !== "hidden" && it.status !== "draft"));
const byId = id => ITEMS.find(x => x.id === id);
const inStock = it => it.status === "active" && (it.stock || 0) > 0;
const stockFirst = list => [...list.filter(inStock), ...list.filter(it => !inStock(it))];
const sizesOf = it => (it.sizes || "").split(/[\s,\/]+/).filter(s => /^(X{0,3}S|M|X{0,3}L|\d{2,3})$/i.test(s));

async function call(action, data){
  if (!API) throw new Error("Сервер не подключён");
  const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json", "x-init-data": (tg && tg.initData) || ""}, body: JSON.stringify({action, ...data})});
  const j = await r.json().catch(() => ({error:"Ошибка сервера"}));
  if (j.error) throw new Error(j.error);
  return j;
}
// корзина, лайки и контакты — в облаке Telegram (видны на всех устройствах клиента), запасной вариант — браузер
const store = {
  cloud: () => tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"),
  get(k){ return new Promise(ok => {
    const local = () => { try { ok(JSON.parse(localStorage.getItem(k) || "null")); } catch(_) { ok(null); } };
    if (!store.cloud()) return local();
    const t = setTimeout(local, 1500);  // если Telegram не ответил — берём из браузера, не зависаем
    tg.CloudStorage.getItem(k, (e, v) => { clearTimeout(t); if (e || !v) return local(); try { ok(JSON.parse(v)); } catch(_) { local(); } });
  }); },
  set(k, v){ const s = JSON.stringify(v); try { localStorage.setItem(k, s); } catch(_) {} if (store.cloud()) try { tg.CloudStorage.setItem(k, s); } catch(_) {} }
};
const saveCart = () => { store.set("eon_cart", CART); badges(); };
const saveLikes = () => store.set("eon_likes", LIKES);
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(_) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(e) {} ta.remove(); }
  haptic(); toast("Скопировано");
}

// ---------- навигация: стек экранов, системная кнопка «Назад» Telegram ----------
function go(view, arg, replace){
  if (replace) stack.pop();
  else if (stack.length) stack[stack.length - 1].y = window.scrollY;  // запомнили прокрутку экрана, с которого ушли
  stack.push([view, arg]); render();
}
function back(){
  if (drawer) return closeDrawer();
  if (stack.length > 1) { stack.pop(); render.restore = stack[stack.length - 1].y || 0; render(); }
}
function tab(t){ stack = [[t]]; render(); }
function setMain(text, fn){
  if (!tg) return;
  if (setMain.fn) tg.MainButton.offClick(setMain.fn);
  setMain.fn = null;
  if (!text) { tg.MainButton.hide(); return; }
  setMain.fn = fn; tg.MainButton.setParams({text, is_visible:true, is_active:true, color:"#f3f2ef", text_color:"#0b0b0c"}); tg.MainButton.onClick(fn);
}
const VIEWS = {};
function render(){
  const [v, arg] = stack[stack.length - 1];
  setMain(null);
  if (tg) stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
  const root = stack[0][0];
  document.querySelectorAll("#bar button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === root));
  $("bar").hidden = ["checkout", "edit", "group", "texts", "hero", "section", "homeedit", "avito"].includes(v);
  (VIEWS[v] || VIEWS.home)(arg);
  if (render.restore != null) {
    // возвращаемся туда же; повторяем, пока догружаются картинки и страница не стала нужной высоты
    const y = render.restore; render.restore = null;
    window.scrollTo(0, y); requestAnimationFrame(() => window.scrollTo(0, y)); setTimeout(() => window.scrollTo(0, y), 120); setTimeout(() => window.scrollTo(0, y), 400);
  } else if (!render.keep) window.scrollTo(0, 0);
  render.keep = false;
}
function badges(){
  const n = CART.reduce((s, c) => s + c.qty, 0);
  $("bCartN").hidden = !n; $("bCartN").textContent = n;
  const o = ADMIN ? ORDERS.filter(o => o.status === "new").length : 0;
  $("bMenuN").hidden = !o; $("bMenuN").textContent = o;
}

// ---------- карточка в сетке ----------
function card(it){
  const liked = LIKES.includes(it.id), sale = it.old_price > it.price;
  return `<div class="pc">
    <button class="ph" data-open="${esc(it.id)}">${it.photos[0] ? `<img src="${esc(it.photos[0])}" alt="" loading="lazy">` : ""}
      ${it.status === "sold" ? '<span class="tag dark">Продано</span>' : it.status === "hidden" ? '<span class="tag dark">Архив</span>' : it.status === "draft" ? '<span class="tag dark">Черновик</span>' : sale ? `<span class="tag">−${Math.round((1 - it.price / it.old_price) * 100)}%</span>` : ""}
      ${ADMIN && it.stock > 0 ? `<span class="tag stock">В наличии · ${it.stock}</span>` : ""}</button>
    <button class="heart" data-like="${esc(it.id)}" aria-pressed="${liked}" aria-label="В лайки">${HEART}</button>
    <button class="cap" data-open="${esc(it.id)}"><div class="nm">${esc(it.title)}</div><div class="pr tn">${rub(it.price)}${sale ? `<s>${rub(it.old_price)}</s>` : ""}</div>${ADMIN && it.private && it.private.cost ? `<div class="real tn">закупка ${rub(it.private.cost)}</div>` : ""}</button>
  </div>`;
}
function bindCards(){
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => go("product", b.dataset.open));
  app.querySelectorAll("[data-like]").forEach(b => b.onclick = e => { e.stopPropagation(); toggleLike(b.dataset.like); b.setAttribute("aria-pressed", LIKES.includes(b.dataset.like)); });
}
function toggleLike(id){
  const i = LIKES.indexOf(id);
  if (i >= 0) LIKES.splice(i, 1); else { LIKES.unshift(id); haptic("light"); }
  saveLikes();
}
const grid = (list, layout) => list.length ? `<div class="grid ${layout ? "L-" + layout : ""}">${list.map(card).join("")}</div>` : `<div class="empty">Пока пусто</div>`;
const LAYOUTS = {full: "На весь экран", "1": "1 в ряд", "2": "2 в ряд", "3": "3 в ряд", "4": "4 в ряд", row: "Лента вбок"};
const newest = list => [...list].sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")) || colorRank(a) - colorRank(b));

// ---------- главная ----------
const HERO_DEFAULT = {date:"", title:"EP", sub:"Москва · под заказ", text:"Одежда, которую мы сами отбираем у фабрик и проверяем по фото и отзывам.\n\nПривозим под заказ за 2–3 недели. Выберите вещь и размер — подтвердим наличие и срок в чате.", image:"hero.jpg", button:"Смотреть коллекцию"};
// разделы главной: хранятся в настройках (settings.home), админ меняет их прямо в приложении
const HOME_DEFAULT = [
  {title: "Новое поступление", source: "new", limit: 8, layout: "row", items: []}
];
const SOURCES = {new: "Новинки (сами, по дате)", all: "Всё наличие (сами)", group: "Товары из группы", manual: "Выбрать вручную"};
const homeSections = () => (SET.home && SET.home.sections) || HOME_DEFAULT;
function sectionItems(sec){
  const vis = visible();
  const list = sec.source === "new" ? newest(vis)
    : sec.source === "group" ? vis.filter(it => ((GROUPS.find(g => g.id === sec.group) || {}).items || []).includes(it.id))
    : sec.source === "manual" ? (sec.items || []).map(byId).filter(it => it && it.status !== "hidden")
    : vis;
  return sec.source !== "manual" && sec.limit > 0 ? list.slice(0, sec.limit) : list;
}
async function saveHome(sections){
  await call("settings_save", {key: "home", value: {sections}});
  SET.home = {sections};
}
VIEWS.purchase = () => {
  const lines = [...((SET.purchase && SET.purchase.lines) || [])].filter(l => byId(l.id));
  const sum = lines.reduce((a, l) => { const p = byId(l.id).private || {}; a.cny += (p.cny || 0) * l.qty; a.kg += (p.kg || 0) * l.qty; a.n += l.qty; return a; }, {cny: 0, kg: 0, n: 0});
  const cost = Math.round((sum.cny * 12 + sum.kg * 480) / 10) * 10;
  app.innerHTML = `<button class="back" id="bk">← Назад</button><div class="h1">Закупка <small class="tn">${sum.n} шт.</small></div>
    ${lines.length ? lines.map((l, i) => { const it = byId(l.id), p = it.private || {}; return `<div class="ord">
      <div class="ln" style="margin-top:0"><img src="${esc(it.photos[0] || "")}" alt=""><div style="flex:1;min-width:0"><div class="up" style="font-size:10.5px">${esc(it.title)}</div>
        <div class="note">${esc(it.id)} · ${[l.size, l.color].filter(Boolean).map(esc).join(" · ") || "без варианта"} · ¥${p.cny || "?"} за шт.</div></div></div>
      ${(p.links || []).map(([n, u]) => `<button class="src" data-u="${esc(u)}">${esc(n)} ↗</button>`).join("") || '<p class="note bad">Нет ссылки на поставщика</p>'}
      <div class="row"><div class="qty"><button data-q="${i}" data-d="-1" aria-label="Меньше">−</button><span class="tn">${l.qty}</span><button data-q="${i}" data-d="1" aria-label="Больше">+</button></div><button class="btn sm del" data-rm="${i}">Убрать</button></div>
    </div>`; }).join("") : `<div class="empty">Закупка пуста — добавляйте вещи кнопкой «В закупку» в карточке товара</div>`}
    ${lines.length ? `<div class="realbox" style="margin-top:14px"><div class="ttl">Итого по закупке</div>
      <div class="rr"><span>Товар у поставщиков</span><b class="tn">¥${Math.round(sum.cny * 100) / 100} ≈ ${rub(Math.round(sum.cny * 12))}</b></div>
      <div class="rr"><span>Вес примерно</span><b class="tn">${Math.round(sum.kg * 10) / 10} кг · карго ${rub(Math.round(sum.kg * 480))}</b></div>
      <div class="rr"><span>Под ключ</span><b class="tn">${rub(cost)}</b></div></div>
      <div class="stack" style="margin-top:12px"><button class="btn w" id="pcopy">Скопировать список для карго</button><button class="btn del" id="pclear">Очистить закупку</button></div>` : ""}`;
  $("bk").onclick = back;
  const store2 = async next => { try { await call("settings_save", {key: "purchase", value: {lines: next}}); SET.purchase = {lines: next}; render.keep = true; render(); } catch(e) { toast(e.message); } };
  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { const next = lines.map(x => ({...x})); const l = next[+b.dataset.q]; l.qty = Math.max(1, l.qty + +b.dataset.d); store2(next); });
  app.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => store2(lines.filter((_, i) => i !== +b.dataset.rm)));
  app.querySelectorAll(".src").forEach(b => b.onclick = () => tg && tg.openLink ? tg.openLink(b.dataset.u) : window.open(b.dataset.u, "_blank"));
  if ($("pcopy")) $("pcopy").onclick = () => copy(lines.map((l, i) => { const it = byId(l.id), p = it.private || {};
    return `${i + 1}. ${it.title} (${it.id})\n${[l.color, l.size].filter(Boolean).join(", ")} — ${l.qty} шт × ¥${p.cny || "?"}\n${(p.links || []).map(([, u]) => u).join("\n")}`; }).join("\n\n")
    + `\n\nИтого: ${sum.n} шт, ¥${Math.round(sum.cny * 100) / 100}, ~${Math.round(sum.kg * 10) / 10} кг`);
  if ($("pclear")) { let armed = false; $("pclear").onclick = () => { if (!armed) { armed = true; $("pclear").textContent = "Точно очистить?"; setTimeout(() => { armed = false; if ($("pclear")) $("pclear").textContent = "Очистить закупку"; }, 3000); return; } store2([]); }; }
};
VIEWS.importhelp = () => {
  const mk = (SET.markup && SET.markup.x) || 1.8;
  app.innerHTML = `<button class="back" id="bk">← Назад</button><div class="h1">Импорт товаров</div>
    <div class="desc"><p>Объявление собирается само со страницы товара на Pinduoduo или 1688: фото, цена в юанях, ссылка на оригинал, а нейросеть пишет название, описание и характеристики по-русски.</p>
    <ul><li>Отправьте боту <b>/key</b> — придёт ссылка.</li><li>Откройте её на компьютере и перетащите кнопку «→ EP» на панель закладок.</li><li>Откройте товар на Pinduoduo или 1688 и нажмите закладку.</li><li>Черновик появится здесь: меню → Черновики. Проверьте и нажмите «Опубликовать».</li></ul></div>
    <label class="lbl" for="mk">Наценка по умолчанию (цена = себестоимость × наценка)</label>
    <input class="f tn" id="mk" type="number" inputmode="decimal" step="0.1" min="1" value="${mk}">
    <p class="note">Себестоимость = цена в ¥ × 12 + вес × 480 ₽ (карго). Цена округляется до …90 ₽. В каждом черновике её можно поменять.</p>
    <div style="height:12px"></div><button class="btn w" id="mksave">Сохранить наценку</button>`;
  $("bk").onclick = back;
  $("mksave").onclick = async () => {
    const x = parseFloat($("mk").value); if (!(x >= 1)) return toast("Наценка — число не меньше 1, например 1.8");
    try { await call("settings_save", {key: "markup", value: {x}}); SET.markup = {x}; haptic(); toast("Сохранено"); } catch(e) { toast(e.message); }
  };
};
VIEWS.homeedit = () => {
  const secs = JSON.parse(JSON.stringify(homeSections()));
  app.innerHTML = `<button class="back" id="bk">← Назад</button><div class="h1">Разделы главной</div>
    <p class="note">Порядок здесь = порядок на экране под блоком дропа. Нажмите на раздел, чтобы изменить название, товары и сетку.</p>
    <div>${secs.map((s, i) => `<div class="grow">
      <button class="gname" data-e="${i}">${esc(s.title)}<span>${SOURCES[s.source]} · ${LAYOUTS[s.layout] || "2 в ряд"} · ${sectionItems(s).length} шт.</span></button>
      ${i ? `<button class="gico" data-up="${i}" aria-label="Выше">↑</button>` : ""}
      <button class="gico del" data-d="${i}" aria-label="Удалить раздел">✕</button></div>`).join("") || '<div class="empty">Разделов нет</div>'}</div>
    <div style="height:16px"></div><button class="btn w" id="snew">+ Новый раздел</button>`;
  $("bk").onclick = back;
  $("snew").onclick = () => go("section", -1);
  app.querySelectorAll("[data-e]").forEach(b => b.onclick = () => go("section", +b.dataset.e));
  app.querySelectorAll("[data-up]").forEach(b => b.onclick = async () => { const i = +b.dataset.up; [secs[i - 1], secs[i]] = [secs[i], secs[i - 1]]; try { await saveHome(secs); haptic("light"); render.keep = true; render(); } catch(e) { toast(e.message); } });
  app.querySelectorAll("[data-d]").forEach(b => { let armed = false; b.onclick = async () => {
    if (!armed) { armed = true; b.textContent = "Удалить?"; b.classList.add("wide"); setTimeout(() => { armed = false; b.textContent = "✕"; b.classList.remove("wide"); }, 3000); return; }
    secs.splice(+b.dataset.d, 1); try { await saveHome(secs); haptic(); toast("Раздел удалён, товары остались"); render.keep = true; render(); } catch(e) { toast(e.message); }
  }; });
};
VIEWS.section = idx => {
  const all = JSON.parse(JSON.stringify(homeSections()));
  const isNew = idx < 0 || idx >= all.length;
  const sec = isNew ? {title: "", source: "manual", limit: 0, layout: "2", items: []} : all[idx];
  sec.items = sec.items || [];
  const icon = l => l === "full" ? '<i style="width:30px"><b style="aspect-ratio:4/5"></b></i>' : l === "row" ? '<i style="grid-template-columns:repeat(3,1fr);width:54px"><b></b><b></b><b style="opacity:.25"></b></i>'
    : `<i style="grid-template-columns:repeat(${l},1fr)">${"<b></b>".repeat(+l * (l === "1" ? 1 : 2))}</i>`;
  const draw = () => {

// лента «Для вас»: сначала вещи в наличии, внутри — похожее на то, что клиент смотрел, лайкал и положил в корзину
const forYou = list => stockFirst(bySignals(list));
function bySignals(list){
  const signals = [...CART.map(c => [c.id, 3]), ...LIKES.map(id => [id, 2]), ...RECENT.slice(0, 15).map((id, i) => [id, 1.5 - i * 0.08])];
  const src = signals.map(([id, w]) => [byId(id), w]).filter(([x]) => x);
  if (!src.length) return newest(list);
  return list.map(x => {
    let sc = 0;
    for (const [r, w] of src) {
      if (r.id === x.id) { sc -= w * 0.5; continue; }  // уже видел — чуть ниже, но не прячем
      if (r.type && r.type === x.type) sc += 3 * w;
      if (r.section && r.section === x.section) sc += 2 * w;
      if (r.price && Math.abs(x.price - r.price) / r.price < 0.3) sc += w;
    }
    return [sc, x];
  }).sort((a, b) => b[0] - a[0] || String(b[1].created_at || "").localeCompare(String(a[1].created_at || ""))).map(([, x]) => x);
}
const SORTS = {foryou: "Для вас", new: "Новинки", asc: "Цена ↑", desc: "Цена ↓", color: "По цвету"};

// разделы для поиска: группы + типы вещей, с числом вещей в каждом
function feedSections(base){
  const out = GROUPS.map(g => ({key: "g:" + g.id, name: g.name, n: base.filter(it => g.items.includes(it.id)).length, kind: "Группа"}));
  const types = {};
  base.forEach(it => { if (it.type) types[it.type] = (types[it.type] || 0) + 1; });
  const hidden = (SET.feed && SET.feed.hiddenTypes) || [];
  const tlist = Object.entries(types).filter(([t]) => !hidden.includes(t) && !out.some(x => x.name.toLowerCase() === t.toLowerCase()))
    .sort((a, b) => b[1] - a[1]).map(([t, n]) => ({key: "t:" + t, name: t, n, kind: "Тип"}));
  return [...out.filter(x => x.n > 0 || ADMIN), ...tlist];
}
function applyFilters(list, o){
  if (o.sec) {
    const [k, v] = [o.sec.slice(0, 1), o.sec.slice(2)];
    if (k === "g") { const g = GROUPS.find(g => String(g.id) === v); list = list.filter(it => g && g.items.includes(it.id)); }
    else list = list.filter(it => it.type === v);
  }
  if (o.q) { const q = o.q.toLowerCase(); list = list.filter(it => (it.title + " " + it.type + " " + it.section + " " + it.id + " " + (it.facts || []).map(f => f[1]).join(" ")).toLowerCase().includes(q)); }
  if (o.size) list = list.filter(it => sizesOf(it).map(z => z.toUpperCase()).includes(o.size));
  if (o.sale) list = list.filter(it => it.old_price > it.price);
  if (o.stock) list = list.filter(inStock);
  if (o.sort === "asc") return [...list].sort((a, b) => a.price - b.price);
  if (o.sort === "desc") return [...list].sort((a, b) => b.price - a.price);

  if (o.sort === "color") return byColor(list);

}

// ---------- рекомендации: тот же тип, тот же раздел, общие группы, похожая цена ----------
function recommend(it, n = 8){
  const groupsOf = new Set(GROUPS.filter(g => g.items.includes(it.id)).map(g => g.id));
  return visible().filter(x => x.id !== it.id && x.status === "active").map(x => {
    let sc = 0;
    if (x.type && x.type === it.type) sc += 4;
    if (x.section && x.section === it.section) sc += 3;
    if (GROUPS.some(g => groupsOf.has(g.id) && g.items.includes(x.id))) sc += 2;
    if (it.price && Math.abs(x.price - it.price) / it.price < 0.3) sc += 1;
    if (LIKES.includes(x.id)) sc += 1;
    if (inStock(x)) sc += 3;
    // небольшая «перетасовка», стабильная для пары товаров, чтобы подборки не выглядели одинаково
    const h = [...(it.id + x.id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7) / 997;
    return [sc + h, x];
  }).sort((a, b) => b[0] - a[0]).slice(0, n).map(([, x]) => x);
}

function descHTML(t){
  const out = []; let ul = null;
  String(t || "").split("\n").forEach(line => {
    const s = line.trim();
    if (/^[•\-–]\s*/.test(s)) { if (!ul) { ul = []; out.push(ul); } ul.push(s.replace(/^[•\-–]\s*/, "")); }
    else { ul = null; if (s) out.push(s); }
  });
  return out.map(x => Array.isArray(x) ? `<ul>${x.map(li => `<li>${esc(li)}</li>`).join("")}</ul>` : `<p>${esc(x)}</p>`).join("");
}

VIEWS.match = () => {
  const pool = visible().filter(it => it.status === "active" && !LIKES.includes(it.id) && !SEEN.includes(it.id));
  if (!pool.length) {
    app.innerHTML = `<div class="empty" style="padding-top:120px">Вы посмотрели всё</div><div class="stack"><button class="btn" id="mr">Начать заново</button><button class="btn w" id="ml">Мои лайки</button></div>`;
    $("mr").onclick = () => { SEEN = []; render(); };
    $("ml").onclick = () => tab("likes");
    return;
  }
  const it = pool[0];
  app.innerHTML = `<div class="mwrap"><div class="mcard" id="mc">
      <div class="ph"><img src="${esc(it.photos[0] || "")}" alt=""></div>
      <div class="cap"><span>${esc(it.title)}</span><span class="tn">${rub(it.price)}</span></div>
      <div class="stamp like">Лайк</div><div class="stamp nope">Пропуск</div>
    </div></div>
    <div class="mbtns"><button id="mn" aria-label="Пропустить"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="y" id="my" aria-label="Лайк">${HEART}</button></div>`;
  const c = $("mc"), like = c.querySelector(".like"), nope = c.querySelector(".nope");
  const decide = yes => {
    c.style.transform = `translateX(${yes ? 140 : -140}%) rotate(${yes ? 18 : -18}deg)`; c.style.opacity = 0;
    if (yes) { LIKES.unshift(it.id); saveLikes(); haptic("light"); } else SEEN.push(it.id);
    setTimeout(() => { render.keep = true; render(); }, 220);
  };
  $("my").onclick = () => decide(true); $("mn").onclick = () => decide(false);
  let x0 = null, dx = 0, moved = false;
  c.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; moved = false; c.style.transition = "none"; c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", e => { if (x0 === null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true; c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; like.style.opacity = Math.max(0, dx / 100); nope.style.opacity = Math.max(0, -dx / 100); });
  const up = () => { if (x0 === null) return; x0 = null; c.style.transition = ""; if (Math.abs(dx) > 90) decide(dx > 0); else { c.style.transform = ""; like.style.opacity = nope.style.opacity = 0; if (!moved) go("product", it.id); } };
  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
};

async function save(it){

// фото уменьшаем на телефоне до 1600 px, чтобы загрузка была быстрой
async function shrink(file){
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg", 0.86).split(",")[1];
}

// ИИ-фото лежат в папке ai/ рядом с приложением, список — в ai.json. Ставим их первыми, фото поставщика оставляем после
async function applyAiPhotos(){
  const b = $("maip"); b.disabled = true;
  try {
    const man = await (await fetch("ai.json", {cache: "no-store"})).json();
    let n = 0;
    for (const [id, urls] of Object.entries(man)) {
      const it = byId(id); if (!it) continue;
      const ai = urls.map(u => new URL(u, location.href).href);
      const photos = [...ai, ...it.photos.filter(p => !/\/ai\/EON-/.test(p))];
      if (JSON.stringify(photos) === JSON.stringify(it.photos)) continue;
      b.textContent = `Ставлю фото… ${++n}`;

    }
    haptic(); toast(n ? `Готово: обновлено товаров — ${n}` : "Все ИИ-фото уже стоят"); closeDrawer(); tab("home");
  } catch(e) { toast("Не получилось: " + e.message); }
  finally { b.disabled = false; b.textContent = "Поставить ИИ-фото первыми"; }
}

// ---------- Авито: товар выкладывается на один из аккаунтов через фид Автозагрузки ----------
let AVITO = null;  // справочники с сервера (только админам): категории, цвета, виды кофт, список брендов
const avAccounts = () => (SET.avito && SET.avito.accounts) || ["Аккаунт 1"];
const avFeed = n => `${API}?avito=${n}`;
const AV_COLOR_WORDS = [["чёрн", "Чёрный"], ["черн", "Чёрный"], ["тёмно-син", "Синий"], ["темно-син", "Синий"], ["голуб", "Голубой"], ["син", "Синий"], ["бордо", "Бордовый"], ["винн", "Бордовый"],
  ["корич", "Коричневый"], ["шоколад", "Коричневый"], ["кофе", "Коричневый"], ["беж", "Бежевый"], ["песоч", "Бежевый"], ["крем", "Бежевый"], ["молоч", "Белый"], ["бел", "Белый"], ["серебр", "Серебряный"],
  ["графит", "Серый"], ["сер", "Серый"], ["хаки", "Зелёный"], ["олив", "Зелёный"], ["зел", "Зелёный"], ["красн", "Красный"], ["роз", "Розовый"], ["жёлт", "Жёлтый"], ["желт", "Жёлтый"],
  ["фиолет", "Фиолетовый"], ["лаванд", "Фиолетовый"], ["оранж", "Оранжевый"], ["золот", "Золотой"]];
function avColor(it){
  const f = (it.facts || []).find(([k]) => /^цвет/i.test(k));
  const src = `${f && !/уточн/.test(f[1]) ? f[1] : ""} ${it.title}`.toLowerCase();
  const hit = AV_COLOR_WORDS.find(([w]) => src.includes(w));
  return hit ? hit[1] : "";
}
function avGuess(it){
  const t = `${it.type || ""} ${it.title}`.toLowerCase(), m = it.section === "Мужское" || (!/женск/.test(t) && /мужск/.test(t));
  let cat = "";
  if (it.type === "Обувь" || /сапог|ботин|ботильон|кроссов|кеды|сникер|дутик|угги/.test(t)) {
    const k = /ботильон/.test(t) ? "ankle" : /сапог/.test(t) ? "boots" : /кроссов|кеды|сникер/.test(t) ? "sneak" : /дутик|угги|валенк/.test(t) ? "ugg" : "shoes";
    cat = m ? "ms_" + (k === "sneak" || k === "ugg" ? k : "boots") : "ws_" + k;
  }
  else if (/шуб/.test(t)) cat = m ? "m_sheep" : "w_fur";
  else if (/дублён|дублен|овчин/.test(t)) cat = m ? "m_sheep" : "w_sheep";
  else if (/парк/.test(t)) cat = m ? "m_parka" : "w_winter";
  else if (/бомбер/.test(t)) cat = m ? "m_bomber" : "w_demi";
  else if (/костюм|пиджак|жакет/.test(t)) cat = m ? "" : "w_suit";
  else if (/кардиган|свитер|джемпер|кофт|водолаз/.test(t)) cat = m ? "" : "w_knit";
  else if (/джинс/.test(t)) cat = m ? "m_jeans" : "w_jeans";
  else if (/брюк|леггинс|штан|sweatpants/.test(t)) cat = m ? "m_pants" : "w_pants";
  else if (/куртк|пуховик|jacket|puffer|аляск/.test(t)) cat = m ? "m_winter" : "w_winter";
  const sub = /свитер/.test(t) ? "Свитер" : /джемпер/.test(t) ? "Джемпер" : /водолаз/.test(t) ? "Водолазка" : /кофт/.test(t) ? "Кофта" : "Кардиган";
  return {acc: "", cat, color: avColor(it), sub};
}
const avOf = it => { const s = (it.private && it.private.avito) || {}, g = avGuess(it); return {acc: s.acc || "", cat: s.cat || g.cat, color: s.color || g.color, sub: s.sub || g.sub}; };
const avBrand = it => !!AVITO && new RegExp(AVITO.brands, "i").test(`${it.title} ${it.description || ""}`);
function avIssues(it, av){
  const out = [];
  if (it.status !== "active") out.push(STATUS[it.status].toLowerCase());
  if (avBrand(it)) out.push("бренд в названии или описании");
  if (!it.photos.length) out.push("нет фото");
  if (!av.cat) out.push("не выбрана категория");
  if (!av.color) out.push("не выбран цвет");
  if (/^(ws|ms)_/.test(av.cat) && !sizesOf(it).some(z => +z >= 34 && +z <= 48)) out.push("нет размера обуви");
  return out;
}
async function avSet(it, patch){
  const avito = {...avOf(it), ...patch};
  return save({...it, private: {...(it.private || {}), avito}});
}

  $("bk").onclick = back;
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => go("product", b.dataset.open));
  $("av_save").onclick = async () => {
    const value = {...(SET.avito || {}), address: $("av_a").value.trim() || "Московская область, Королёв", accounts: [...app.querySelectorAll("[data-an]")].map((x, i) => x.value.trim() || `Аккаунт ${i + 1}`)};
    try { await call("settings_save", {key: "avito", value}); SET.avito = value; haptic(); toast("Сохранено"); render.keep = true; render(); } catch(e) { toast(e.message); }
